name: Build AntigravityIDE AppImage
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and update the latest release even when the source hash is unchanged'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "5 */6 * * *"
  push:
    branches:
      - "main"

jobs:
  release:
    name: Build and publish AntigravityIDE AppImage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Re-enabling the workflow keeps GitHub from disabling the schedule
      # after 60 days without repository activity.
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Install libfuse2
        run: sudo apt-get update && sudo apt-get install -y libfuse2 imagemagick jq
      - name: Resolve official release
        id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/resolve-release.py
      - name: Stop when the source is unchanged
        if: steps.source.outputs.changed != 'true' && inputs.force != true
        run: echo "The official source archive is unchanged; no release will be published."
      - name: Build
        if: steps.source.outputs.changed == 'true' || inputs.force == true
        id: build
        uses: Mate-Logic/appimage-python@main
        with:
          version_url: ${{ steps.source.outputs.download_url }}
          version_file: 'resources/app/product.json'
          version_bash: 'jq -r ".ideVersion"'
          version_icon: 'code.png'
          version_sha256: ${{ steps.source.outputs.sha256 }}
          version_archive: ${{ steps.source.outputs.archive_path }}
          update_information: 'gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|AntigravityIDE*.AppImage.zsync'
      - name: Create checksum manifests
        if: steps.source.outputs.changed == 'true' || inputs.force == true
        run: |
          sha256sum dist/*.AppImage* > dist/SHA256SUMS
          md5sum dist/*.AppImage* > dist/MD5SUMS
          sha512sum dist/*.AppImage* > dist/SHA512SUMS
          printf '%s  official-source.tar.gz\n' '${{ steps.source.outputs.sha256 }}' > dist/SOURCE-SHA256
      - name: Upload workflow artifact
        if: steps.source.outputs.changed == 'true' || inputs.force == true
        uses: actions/upload-artifact@v7
        with:
          name: AntigravityIDE-AppImage
          path: 'dist'
      - name: Prepare release notes
        if: steps.source.outputs.changed == 'true' || inputs.force == true
        run: |
          {
            echo "## Antigravity IDE ${{ steps.source.outputs.version }}"
            echo
            printf 'Built from the official Linux x86_64 archive. The source archive SHA-256 is `%s`.\n' '${{ steps.source.outputs.sha256 }}'
            echo
            echo "| Asset | SHA-256 | MD5 | SHA-512 |"
            echo "| --- | --- | --- | --- |"
            for asset in dist/*.AppImage; do
              name=$(basename "$asset")
              sha256=$(sha256sum "$asset" | cut -d ' ' -f 1)
              md5=$(md5sum "$asset" | cut -d ' ' -f 1)
              sha512=$(sha512sum "$asset" | cut -d ' ' -f 1)
              printf '| `%s` | `%s` | `%s` | `%s` |\n' "$name" "$sha256" "$md5" "$sha512"
            done
          } > RELEASE_NOTES.md
      - name: Publish release
        if: steps.source.outputs.changed == 'true' || inputs.force == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version='${{ steps.source.outputs.version }}'
          tag="v$version"
          title="Antigravity IDE $version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$title" --notes-file RELEASE_NOTES.md --latest
          fi
      - name: Keep the scheduled workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/release.yml/enable"
